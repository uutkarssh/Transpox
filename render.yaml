services:
  - type: web
    name: transpox-detection
    runtime: docker
    dockerfilePath: services/detection/Dockerfile
    dockerContext: services/detection
    healthCheckPath: /health
    envVars:
      - key: HF_SPACE
        value: Utkarssh/transpox-api
      - key: TRANPOX_CONFIDENCE
        value: "0.25"
      - key: TRANPOX_MODEL
        value: models/pothole.pt
      - key: TRANPOX_VEHICLE_MODEL
        value: models/vehicles.pt
